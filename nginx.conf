server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: /todos/123 으로 직접 들어와도 index.html 을 돌려줍니다.
    # (이게 없으면 새로고침할 때 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 정적 자산은 길게 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않아야 새 배포가 바로 반영됩니다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
